name: Android build and emulator test
on:
  push:
    paths:
      - 'android/**'
      - 'ios/b64/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned-aligned APK with the official SDK tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          BT=$ANDROID_HOME/build-tools/34.0.0; JAR=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p b/res/mipmap-xxxhdpi b/assets/img b/cls b/gen
          base64 -d android/icon.b64 > b/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/assets/data.json android/assets/extras.json b/assets/
          python3 -c "import json,glob;d={};[d.update(json.load(open(f))) for f in sorted(glob.glob('android/assets/i18n_*.json'))];json.dump(d,open('b/assets/i18n.json','w'),ensure_ascii=False)"
          cp ios/Zaeir/Resources/credits.json b/assets/img/credits.json
          for base in $(ls ios/b64 | sed 's/\.b64\.[0-9]*$//' | sort -u); do
            [ "$base" = "icon-1024.png" ] && continue
            cat ios/b64/$base.b64.* | base64 -d > b/assets/img/$base.jpg
          done
          ls b/assets/img | wc -l
          $BT/aapt2 compile --dir b/res -o b/res.zip
          $BT/aapt2 link -o b/base.apk -I $JAR --manifest android/AndroidManifest.xml -R b/res.zip --java b/gen -A b/assets --min-sdk-version 21 --target-sdk-version 33
          javac --release 8 -cp $JAR -d b/cls $(find android/src b/gen -name '*.java') 2>&1 | grep -v '^Note:' || true
          $BT/d8 --lib $JAR --min-api 21 --output b $(find b/cls -name '*.class')
          cd b && zip -q -j base.apk classes.dex && cd ..
          $BT/zipalign -f -p 4 b/base.apk b/aligned.apk
          cp b/aligned.apk zaeir-unsigned-aligned.apk
          keytool -genkeypair -keystore b/test.jks -storepass testtest -keypass testtest -alias t -keyalg RSA -keysize 2048 -validity 30 -dname "CN=ci-test" >/dev/null 2>&1
          $BT/apksigner sign --ks b/test.jks --ks-pass pass:testtest --out b/test.apk b/aligned.apk
          $BT/apksigner verify b/test.apk && echo signed-ok
          sha256sum zaeir-unsigned-aligned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/run.sh
      - name: Publish APK and screenshots to a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-dev --yes --cleanup-tag 2>/dev/null || true
          gh release create android-dev zaeir-unsigned-aligned.apk --title "Zaeir Android CI build" --notes "Built and emulator-tested by CI (API 33 x86_64, debug-signed test copy). The attached APK is the unsigned build; it is signed separately for release." --latest=false
          gh release upload android-dev shots-android/* --clobber || true
