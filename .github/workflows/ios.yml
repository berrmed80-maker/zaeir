name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundled assets
        run: |
          mkdir -p ios/Zaeir/img
          for base in $(ls ios/b64 | sed 's/\.b64\.[0-9]*$//' | sort -u); do
            if [ "$base" = "icon-1024.png" ]; then
              cat ios/b64/icon-1024.png.b64.* | base64 -d > "ios/Zaeir/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
            else
              cat ios/b64/$base.b64.* | base64 -d > "ios/Zaeir/img/$base.jpg"
            fi
          done
          ls ios/Zaeir/img | wc -l
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Zaeir.xcodeproj -scheme Zaeir -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Zaeir.app out/Payload/
          cd out && zip -r ../zaeir-ios-unsigned.ipa Payload
      - name: Simulator smoke test
        run: |
          cd ios
          xcodebuild -project Zaeir.xcodeproj -scheme Zaeir -configuration Debug -sdk iphonesimulator -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[x for rt in d.values() for x in rt if x.get('isAvailable') and 'iPhone' in x['name']]
          devs.sort(key=lambda x: x['name'])
          print(devs[-1]['udid'])")
          echo "simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          sleep 5
          xcrun simctl install booted build-sim/Build/Products/Debug-iphonesimulator/Zaeir.app
          mkdir -p ../shots
          shot() {
            name="$1"; wait_s="$2"
            xcrun simctl launch booted com.dalil.maroc
            sleep "$wait_s"
            xcrun simctl io booted screenshot "../shots/$name.png"
            sz=$(stat -f%z "../shots/$name.png")
            if [ "$sz" -lt 100000 ]; then
              echo "retry $name (got $sz bytes)"
              xcrun simctl terminate booted com.dalil.maroc || true
              sleep 3
              xcrun simctl launch booted com.dalil.maroc
              sleep $((wait_s + 6))
              xcrun simctl io booted screenshot "../shots/$name.png"
            fi
            xcrun simctl terminate booted com.dalil.maroc || true
          }
          shot 0-welcome-en 12
          xcrun simctl spawn booted defaults write com.dalil.maroc welcomed -bool true
          for T in 0 1 2 3 4; do
            xcrun simctl spawn booted defaults write com.dalil.maroc initialTab -int $T
            shot tab-$T 10
          done
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string ar
          xcrun simctl spawn booted defaults write com.dalil.maroc initialTab -int 0
          shot 6-home-ar 12
          xcrun simctl spawn booted defaults delete com.dalil.maroc welcomed
          shot 7-welcome-ar 12
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string en
          xcrun simctl spawn booted defaults write com.dalil.maroc welcomed -bool true
          xcrun simctl spawn booted defaults write com.dalil.maroc favs -array marrakech "p:marrakech:Koutoubia Mosque" "p:marrakech:Djemaa El-Fna"
          xcrun simctl spawn booted defaults write com.dalil.maroc initialTab -int 3
          shot 8-saved-hearts 12
          xcrun simctl spawn booted defaults write com.dalil.maroc debugCity -string marrakech
          for CT in 0 1 2; do
            xcrun simctl spawn booted defaults write com.dalil.maroc debugCityTab -int $CT
            shot 9-city-tab-$CT 12
          done
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string ar
          xcrun simctl spawn booted defaults write com.dalil.maroc debugCityTab -int 1
          shot 9-city-stay-ar 12
          xcrun simctl spawn booted defaults delete com.dalil.maroc debugCity
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string en
          xcrun simctl spawn booted defaults write com.dalil.maroc debugScreen -string phrasebook
          shot 10-phrasebook-en 12
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string ar
          shot 10-phrasebook-ar 12
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string fr
          xcrun simctl spawn booted defaults write com.dalil.maroc bud_stay -string 400
          xcrun simctl spawn booted defaults write com.dalil.maroc bud_food -string 150
          xcrun simctl spawn booted defaults write com.dalil.maroc bud_transport -string 80
          xcrun simctl spawn booted defaults write com.dalil.maroc bud_activities -string 100
          xcrun simctl spawn booted defaults write com.dalil.maroc debugScreen -string budget
          shot 11-budget-fr 12
      - uses: actions/upload-artifact@v4
        with:
          name: zaeir-ios-unsigned-ipa
          path: zaeir-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: zaeir-ios-simulator-screenshots
          path: shots/*.png
      - name: Publish unsigned IPA to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-dev --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-dev zaeir-ios-unsigned.ipa \
            --title "Zaeir iOS - unsigned compile-only build" \
            --notes "Unsigned IPA built by CI. Compile-only: never run on a device. To install: sideload with Sideloadly/AltStore using a free Apple ID (7-day expiry). Not signed, not App Store ready." \
            --latest=false
          gh release upload ios-dev shots/*.png --clobber
# rebuild 1795713322
