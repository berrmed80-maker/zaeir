name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundled assets
        run: |
          mkdir -p ios/Zaeir/img
          for base in $(ls ios/b64 | sed 's/\.b64\.[0-9]*$//' | sort -u); do
            if [ "$base" = "icon-1024.png" ]; then
              cat ios/b64/icon-1024.png.b64.* | base64 -d > "ios/Zaeir/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
            else
              cat ios/b64/$base.b64.* | base64 -d > "ios/Zaeir/img/$base.jpg"
            fi
          done
          ls ios/Zaeir/img | wc -l
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Zaeir.xcodeproj -scheme Zaeir -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Zaeir.app out/Payload/
          cd out && zip -r ../zaeir-ios-unsigned.ipa Payload
      - name: Simulator smoke test
        run: |
          cd ios
          xcodebuild -project Zaeir.xcodeproj -scheme Zaeir -configuration Debug -sdk iphonesimulator -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[x for rt in d.values() for x in rt if x.get('isAvailable') and 'iPhone' in x['name']]
          devs.sort(key=lambda x: x['name'])
          print(devs[-1]['udid'])")
          echo "simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          sleep 5
          xcrun simctl install booted build-sim/Build/Products/Debug-iphonesimulator/Zaeir.app
          mkdir -p ../shots
          xcrun simctl launch booted com.dalil.maroc
          sleep 10
          xcrun simctl io booted screenshot ../shots/0-welcome.png
          xcrun simctl terminate booted com.dalil.maroc || true
          xcrun simctl spawn booted defaults write com.dalil.maroc welcomed -bool true
          for T in 0 1 2 3 4; do
            xcrun simctl spawn booted defaults write com.dalil.maroc initialTab -int $T
            xcrun simctl launch booted com.dalil.maroc
            sleep 10
            xcrun simctl io booted screenshot ../shots/tab-$T.png
            xcrun simctl terminate booted com.dalil.maroc || true
          done
          xcrun simctl spawn booted defaults write com.dalil.maroc lang -string ar
          xcrun simctl spawn booted defaults write com.dalil.maroc initialTab -int 0
          xcrun simctl launch booted com.dalil.maroc
          sleep 12
          xcrun simctl io booted screenshot ../shots/6-home-ar.png
          xcrun simctl terminate booted com.dalil.maroc || true
          xcrun simctl spawn booted defaults delete com.dalil.maroc welcomed
          xcrun simctl launch booted com.dalil.maroc
          sleep 10
          xcrun simctl io booted screenshot ../shots/0-welcome.png
      - uses: actions/upload-artifact@v4
        with:
          name: zaeir-ios-unsigned-ipa
          path: zaeir-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: zaeir-ios-simulator-screenshots
          path: shots/*.png
      - name: Publish unsigned IPA to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-dev --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-dev zaeir-ios-unsigned.ipa \
            --title "Zaeir iOS - unsigned compile-only build" \
            --notes "Unsigned IPA built by CI. Compile-only: never run on a device. To install: sideload with Sideloadly/AltStore using a free Apple ID (7-day expiry). Not signed, not App Store ready." \
            --latest=false
          gh release upload ios-dev shots/*.png --clobber
