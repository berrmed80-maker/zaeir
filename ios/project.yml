name: Zaeir
options:
  bundleIdPrefix: com.dalil
  deploymentTarget:
    iOS: "16.0"
targets:
  Zaeir:
    type: application
    platform: iOS
    sources:
      - path: Zaeir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dalil.maroc
        PRODUCT_NAME: Zaeir
        MARKETING_VERSION: "6.6"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Zaeir
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Zaeir uses your location to show the cities closest to you. Nothing leaves your phone."
        CODE_SIGNING_ALLOWED: "NO"
